services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./data:/app/data        # <- your JSON file will be here
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - ./data:/app/data        # <- frontend can read JSON too
    ports:
      - "8501:8501"
    depends_on:
      - backend
